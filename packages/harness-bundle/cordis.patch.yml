            - id: paimind-workspace-editors
              name: '@hansen/workspace-editors'
        - id: paimind-artifact-runtime-invariant
          name: '@hansen/artifact-runtime/invariant'
          inject: [invariants]
        - id: paimind-artifact-runtime
          name: '@hansen/artifact-runtime'
        - id: paimind-generator-web-invariant
