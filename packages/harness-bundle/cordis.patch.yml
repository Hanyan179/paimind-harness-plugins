- id: session-title
  config:
    fallbackMaxWords: 36
    fallbackMaxBytes: 144
    maxTitleBytes: 960

- id: session-title-llm
  disabled: true

- insert:
    # Always-on control plane. Product packs below can never disable their manager.
    - id: paimind-invariants
      name: '@deepseek-ai/dsh-invariants'

    - id: paimind-extension-center
      name: '@hansen/extension-center'

    - id: paimind-extension-center-invariant
      name: '@hansen/extension-center/invariant'
      inject: [invariants]

    # Each package invariant shares the lifecycle of its Product Feature Pack.
    # A disabled pack therefore cold-boots even when one of its packages is
    # physically absent, while Cordis disposal releases invariant ownership
    # before a later reinstall/re-enable cycle.
    - id: paimind-pack-experience
      name: cordis:group
      group: true
      disabled: true
      config:
        - id: paimind-branding-invariant
          name: '@hansen/branding/invariant'
          inject: [invariants]
        - id: paimind-branding
          name: '@hansen/branding'
        - id: paimind-visual-experience-invariant
          name: '@hansen/visual-experience/invariant'
          inject: [invariants]
        - id: paimind-visual-experience
          name: '@hansen/visual-experience'
        - id: paimind-conversation-title-invariant
          name: '@hansen/conversation-title/invariant'
          inject: [invariants]
        - id: paimind-conversation-title
          name: '@hansen/conversation-title'
        - id: paimind-capability-runtime-orbs
          name: cordis:group
          group: true
          disabled: true
          config:
            - id: paimind-runtime-orbs-invariant
              name: '@hansen/runtime-orbs/invariant'
              inject: [invariants]
            - id: paimind-runtime-orbs
              name: '@hansen/runtime-orbs'
        - id: paimind-user-settings
          name: '@hansen/user-settings'

    - id: paimind-pack-agents
      name: cordis:group
      group: true
      disabled: true
      config:
        - id: paimind-agent-builder-invariant
          name: '@hansen/agent-builder/invariant'
          inject: [invariants]
        - id: paimind-agent-builder
          name: '@hansen/agent-builder'
        - id: paimind-skill-market-invariant
          name: '@hansen/skill-market/invariant'
          inject: [invariants]
        - id: paimind-skill-market
          name: '@hansen/skill-market'
        - id: paimind-agent-market-invariant
          name: '@hansen/agent-market/invariant'
          inject: [invariants]
        - id: paimind-agent-market
          name: '@hansen/agent-market'

        - id: paimind-mcp-center-invariant
          name: '@hansen/mcp-center/invariant'
          inject: [invariants]
        - id: paimind-mcp-center
          name: '@hansen/mcp-center'
        - id: paimind-feishu-cli-mcp-invariant
          name: '@hansen/feishu-cli-mcp/invariant'
          inject: [invariants]
        - id: paimind-feishu-cli-mcp
