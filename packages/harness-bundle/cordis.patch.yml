- id: session-title
  config:
    fallbackMaxWords: 36
    fallbackMaxBytes: 144
    maxTitleBytes: 960

- id: session-title-llm
  disabled: true

- insert:
    # Always-on control plane. Product packs below can never disable their manager.
    - id: paimind-invariants
      name: '@deepseek-ai/dsh-invariants'

    - id: paimind-extension-center
      name: '@paimind/extension-center'

    - id: paimind-extension-center-invariant
      name: '@paimind/extension-center/invariant'
      inject: [invariants]

    # Each package invariant shares the lifecycle of its Product Feature Pack.
    # A disabled pack therefore cold-boots even when one of its packages is
    # physically absent, while Cordis disposal releases invariant ownership
    # before a later reinstall/re-enable cycle.
    - id: paimind-pack-experience
      name: cordis:group
      group: true
      disabled: true
      config:
        - id: paimind-branding-invariant
          name: '@paimind/branding/invariant'
          inject: [invariants]
        - id: paimind-branding
          name: '@paimind/branding'
        - id: paimind-visual-experience-invariant
          name: '@paimind/visual-experience/invariant'
          inject: [invariants]
        - id: paimind-visual-experience
          name: '@paimind/visual-experience'
        - id: paimind-conversation-title-invariant
          name: '@paimind/conversation-title/invariant'
          inject: [invariants]
        - id: paimind-conversation-title
          name: '@paimind/conversation-title'
        - id: paimind-capability-runtime-orbs
          name: cordis:group
          group: true
          disabled: true
          config:
            - id: paimind-runtime-orbs-invariant
              name: '@paimind/runtime-orbs/invariant'
              inject: [invariants]
            - id: paimind-runtime-orbs
              name: '@paimind/runtime-orbs'
        - id: paimind-user-settings
          name: '@paimind/user-settings'

    - id: paimind-pack-agents
      name: cordis:group
      group: true
      disabled: true
      config:
        - id: paimind-agent-builder-invariant
          name: '@paimind/agent-builder/invariant'
          inject: [invariants]
        - id: paimind-agent-builder
          name: '@paimind/agent-builder'
        - id: paimind-skill-market-invariant
          name: '@paimind/skill-market/invariant'
          inject: [invariants]
        - id: paimind-skill-market
          name: '@paimind/skill-market'
        - id: paimind-agent-market-invariant
          name: '@paimind/agent-market/invariant'
          inject: [invariants]
        - id: paimind-agent-market
          name: '@paimind/agent-market'

    - id: paimind-pack-content
      name: cordis:group
      group: true
      disabled: true
      config:
        - id: paimind-workspace-project-invariant
          name: '@paimind/workspace-project/invariant'
          inject: [invariants]
        - id: paimind-workspace-project
          name: '@paimind/workspace-project'
        - id: paimind-workspace-blueprints-invariant
          name: '@paimind/workspace-blueprints/invariant'
          inject: [invariants]
        - id: paimind-workspace-blueprints
          name: '@paimind/workspace-blueprints'
        - id: paimind-better-sidebar-adapter-invariant
          name: '@paimind/better-sidebar-adapter/invariant'
          inject: [invariants]
        - id: paimind-better-sidebar-adapter
          name: '@paimind/better-sidebar-adapter'
        - id: paimind-artifact-runtime-invariant
          name: '@paimind/artifact-runtime/invariant'
          inject: [invariants]
        - id: paimind-artifact-runtime
          name: '@paimind/artifact-runtime'
        - id: paimind-generator-web-invariant
          name: '@paimind/generator-web/invariant'
          inject: [invariants]
        - id: paimind-generator-web
          name: '@paimind/generator-web'
        - id: paimind-generator-office-invariant
          name: '@paimind/generator-office/invariant'
          inject: [invariants]
        - id: paimind-generator-office
          name: '@paimind/generator-office'
        - id: paimind-renderer-bento-invariant
          name: '@paimind/renderer-bento/invariant'
          inject: [invariants]
        - id: paimind-renderer-bento
          name: '@paimind/renderer-bento'
        - id: paimind-renderer-pdf-invariant
          name: '@paimind/renderer-pdf/invariant'
          inject: [invariants]
        - id: paimind-renderer-pdf
          name: '@paimind/renderer-pdf'
        - id: paimind-artifacts-invariant
          name: '@paimind/artifacts/invariant'
          inject: [invariants]
        - id: paimind-artifacts
          name: '@paimind/artifacts'
        - id: paimind-conversation-artifact-renderer-invariant
          name: '@paimind/conversation-artifact-renderer/invariant'
          inject: [invariants]
        - id: paimind-conversation-artifact-renderer
          name: '@paimind/conversation-artifact-renderer'

    - id: paimind-pack-proposal
      name: cordis:group
      group: true
      disabled: true
      config:
        - id: paimind-category-analysis-adapter-invariant
          name: '@paimind/category-analysis-adapter/invariant'
          inject: [invariants]
        - id: paimind-category-analysis-adapter
          name: '@paimind/category-analysis-adapter'
        - id: paimind-fact-layer-invariant
          name: '@paimind/fact-layer/invariant'
          inject: [invariants]
        - id: paimind-fact-layer
          name: '@paimind/fact-layer'
        - id: paimind-generator-bento-invariant
          name: '@paimind/generator-bento/invariant'
          inject: [invariants]
        - id: paimind-generator-bento
          name: '@paimind/generator-bento'
        - id: paimind-presentation-trace-invariant
          name: '@paimind/presentation-trace/invariant'
          inject: [invariants]
        - id: paimind-presentation-trace
          name: '@paimind/presentation-trace'
        - id: paimind-proposal-experience-invariant
          name: '@paimind/proposal-experience/invariant'
          inject: [invariants]
        - id: paimind-proposal-experience
          name: '@paimind/proposal-experience'
        - id: paimind-walmart-proposal-adapter-invariant
          name: '@paimind/walmart-proposal-adapter/invariant'
          inject: [invariants]
        - id: paimind-walmart-proposal-adapter
          name: '@paimind/walmart-proposal-adapter'

    - id: paimind-pack-automation
      name: cordis:group
      group: true
      disabled: true
      config:
        - id: paimind-notifications-invariant
          name: '@paimind/notifications/invariant'
          inject: [invariants]
        - id: paimind-notifications
          name: '@paimind/notifications'
        - id: paimind-platform-scheduler-invariant
          name: '@paimind/platform-scheduler/invariant'
          inject: [invariants]
        - id: paimind-platform-scheduler
          name: '@paimind/platform-scheduler'
        - id: paimind-scheduler-adapter-harness-invariant
          name: '@paimind/scheduler-adapter-harness/invariant'
          inject: [invariants]
        - id: paimind-scheduler-adapter-harness
          name: '@paimind/scheduler-adapter-harness'
        - id: paimind-scheduler-agent-action
          name: '@paimind/scheduler-adapter-harness/agent-action'
        - id: paimind-scheduler-agent-tool
          name: '@paimind/scheduler-adapter-harness/agent-tool'
          inject: [paimindScheduler, tools, systemPrompt, sessionTitle]
        - id: paimind-scheduler-adapter-http-invariant
          name: '@paimind/scheduler-adapter-http/invariant'
          inject: [invariants]
        - id: paimind-scheduler-adapter-http
          name: '@paimind/scheduler-adapter-http'
        - id: paimind-platform-api-invariant
          name: '@paimind/platform-api/invariant'
          inject: [invariants]
        - id: paimind-platform-api
          name: '@paimind/platform-api'
        - id: paimind-scheduler-adapter-feishu-bot-invariant
          name: '@paimind/scheduler-adapter-feishu-bot/invariant'
          inject: [invariants]
        - id: paimind-scheduler-adapter-feishu-bot
          name: '@paimind/scheduler-adapter-feishu-bot'

    - id: paimind-pack-operations
      name: cordis:group
      group: true
      disabled: true
      config:
        - id: paimind-task-monitor-invariant
          name: '@paimind/task-monitor/invariant'
          inject: [invariants]
        - id: paimind-task-monitor
          name: '@paimind/task-monitor'
        - id: paimind-developer-resources
          name: '@paimind/developer-resources'
