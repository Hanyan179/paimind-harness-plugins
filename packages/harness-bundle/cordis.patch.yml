        - id: paimind-scheduler-adapter-feishu-bot-invariant
          name: '@hansen/scheduler-adapter-feishu-bot/invariant'
          inject: [invariants]
        - id: paimind-scheduler-adapter-feishu-bot
          name: '@hansen/scheduler-adapter-feishu-bot'

    - id: paimind-pack-operations
      name: cordis:group
      group: true
      disabled: true
      config:
        - id: paimind-task-monitor-invariant
          name: '@hansen/task-monitor/invariant'
          inject: [invariants]
        - id: paimind-task-monitor
          name: '@hansen/task-monitor'
        - id: paimind-developer-resources
          name: '@hansen/developer-resources'
